name: Deploy Application

on:
  push:
    branches:
      - test1

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="ecr_image_url=${{ secrets.ECR_REPOSITORY }}"
        working-directory: terraform

      - name: Export Terraform Outputs
        run: |
          ECS_CLUSTER_NAME=$(terraform output -raw ecs_cluster_name || echo "")
          echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME" >> $GITHUB_ENV
          ECS_SERVICE_NAME=$(terraform output -raw ecs_service_name || echo "")
          echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME" >> $GITHUB_ENV
        working-directory: terraform
      
      - name: Debug ECS Variables
        run: |
          echo "ECS_CLUSTER_NAME: $ECS_CLUSTER_NAME"
          echo "ECS_SERVICE_NAME: $ECS_SERVICE_NAME"

      - name: Debug Raw Terraform Outputs
        run: |
          echo "RAW_CLUSTER_NAME:"
          terraform output -raw ecs_cluster_name || echo "No output found"
          echo "RAW_SERVICE_NAME:"
          terraform output -raw ecs_service_name || echo "No output found"
        working-directory: terraform
        
  build-and-deploy:
    needs: terraform  # Espera a que termine terraform antes de ejecutar deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push Docker Image
        run: |
          docker build -t myapp:latest .
          docker tag myapp:latest ${{ secrets.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ECS_SERVICE_NAME --force-new-deployment
