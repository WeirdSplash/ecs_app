name: Deploy Application

on:
  push:
    branches:
      - test1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="ecr_image_url=${{ secrets.ECR_REPOSITORY }}"
        working-directory: terraform

      - name: Capture and Clean Terraform Outputs
        run: |
          ECS_CLUSTER_NAME=$(terraform output -raw ecs_cluster_name || echo "")
          ECS_SERVICE_NAME=$(terraform output -raw ecs_service_name || echo "")
          
          if [[ -z "$ECS_CLUSTER_NAME" || -z "$ECS_SERVICE_NAME" ]]; then
            echo "Error: ECS_CLUSTER_NAME o ECS_SERVICE_NAME está vacío." >&2
            exit 1
          fi
          
          echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME" >> $GITHUB_ENV
          echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME" >> $GITHUB_ENV
          
          echo "ECS_CLUSTER_NAME: '$ECS_CLUSTER_NAME'"
          echo "ECS_SERVICE_NAME: '$ECS_SERVICE_NAME'"
        working-directory: terraform

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push Docker Image
        run: |
          docker build -t myapp:latest .
          docker tag myapp:latest ${{ secrets.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Debug ECS Variables Before Update
        run: |
          echo "GitHub ENV ECS_CLUSTER_NAME: '$ECS_CLUSTER_NAME'"
          echo "GitHub ENV ECS_SERVICE_NAME: '$ECS_SERVICE_NAME'"

      - name: Update ECS Service
        run: |
          if [[ -z "$ECS_CLUSTER_NAME" || -z "$ECS_SERVICE_NAME" ]]; then
            echo "Error: ECS_CLUSTER_NAME o ECS_SERVICE_NAME está vacío." >&2
            exit 1
          fi
          
          echo "Actualizando ECS service..."
          echo "Cluster Name: '$ECS_CLUSTER_NAME'"
          echo "Service Name: '$ECS_SERVICE_NAME'"
          
          aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_SERVICE_NAME" --force-new-deployment
        
        shell: bash
